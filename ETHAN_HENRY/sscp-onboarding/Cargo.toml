[package]
name = "sscp-onboarding"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sscp-onboarding"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-stm32 = { version = "0.6.0", features = ["stm32f429zi", "memory-x", "defmt", "time-driver-any"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-net = { version = "0.9.1", features = ["defmt", "medium-ethernet", "proto-ipv4", "udp"] }
heapless = "0.9"
static_cell = "2"
panic-halt = "1.0.0"
# `serde` enables Message::decode_frames (postcard-framed local values).
sunstruck-messages = { git = "ssh://git@github.com/sscp/sunstruck_onboard_rust_impl.git", branch = "main", features = ["serde"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
